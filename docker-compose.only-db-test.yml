version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: always
    container_name: postgresdb-util-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
volumes:
  db:
    driver: local
